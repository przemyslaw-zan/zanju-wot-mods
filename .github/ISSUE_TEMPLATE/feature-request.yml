name: Feature request
description: An improvement for a mod.
labels: ["Feature request"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Select each mod that the idea is for.
      multiple: true
      options:
        # mod-list: generated by `zwm lint issue-forms`, do not edit
        - Campaign Tracker
        - Crucible Tracker
        - Directives Helper
        - Premium Time
        - Research Progress Bar
        - Salvo Reticle Fix
        # /mod-list
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What must the mod do, and how does that help you? Add screenshots or sketches if they help.
    validations:
      required: true
