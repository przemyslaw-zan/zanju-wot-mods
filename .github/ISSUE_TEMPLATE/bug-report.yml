name: Bug report
description: A mod does not work correctly.
labels: ["Bug"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Select each mod that has the problem.
      multiple: true
      options:
        # mod-list: generated by `zwm lint issue-forms`, do not edit
        - Campaign Tracker
        - Crucible Tracker
        - Directives Helper
        - Premium Time
        - Research Progress Bar
        - Salvo Reticle Fix
        # /mod-list
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thank you for the report.

        **Without the game log, I probably cannot reproduce the problem, so I will likely close the issue.**

        ### How to get the game log

        1. Close the game.
        2. Delete the `game.log` file in your World of Tanks folder.
        3. Start the game and reproduce the problem.
        4. Close the game.
        5. Put the `game.log` file into a `.zip` archive.
        6. Drag the `.zip` file into the field below.
  - type: textarea
    id: log
    attributes:
      label: Game log
      description: The `.zip` archive with the `game.log` file, from the steps above.
      placeholder: Drag the .zip file here.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Description and steps to reproduce
      description: Describe the problem. What happens, and what did you expect to happen? Then write the steps that make the problem occur, and tell me if it occurs every time. Add screenshots if they help.
      placeholder: |
        The banner does not show in the garage. I expected it beside the vehicle name.

        1. Start the game.
        2. Open the garage with a tier X vehicle.
        3. ...
    validations:
      required: true
