name: Master Workflow

on:
  push:
    branches:
    - master
  workflow_dispatch: {}

concurrency:
  group: stable-release
  # Not cancel-in-progress: publishing is not a check that can be safely interrupted and
  # retried later. A run cancelled midway through can leave some mods released and the
  # index not yet refreshed; letting it finish keeps the published state coherent.
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# The release pipeline is meaningful only in the canonical repository: forks pushing to
# their master would otherwise attempt to publish releases and toolchain images into
# their own namespace. Guarding the two root jobs skips the whole dependent chain.
jobs:
  # Named to match checks-on-change.yml's caller, so both report the same check name.
  checks:
    name: Checks
    if: github.repository == 'przemyslaw-zan/zanju-wot-mods'
    uses: ./.github/workflows/checks.yml

  detect:
    name: Detect image input changes
    if: github.repository == 'przemyslaw-zan/zanju-wot-mods'
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.filter.outputs.changed }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Diff image inputs
      id: filter
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" != "push" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        before="${{ github.event.before }}"
        if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if git diff --name-only "$before" "${{ github.sha }}" \
            | grep -Eq '^(tools/Dockerfile|requirements-dev\.txt|requirements-lint-py27\.txt)$'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  image:
    name: Toolchain image
    needs: detect
    if: needs.detect.outputs.image_changed == 'true'
    uses: ./.github/workflows/toolchain-image.yml

  stable-release:
    name: Build and Publish Releases
    needs: [checks, detect, image]
    if: >-
      always()
      && needs.checks.result == 'success'
      && needs.detect.result == 'success'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3 host
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Resolve toolchain image
      id: img
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ needs.detect.outputs.image_changed }}" = "true" ]; then
          echo "ref=ghcr.io/${{ github.repository }}/toolchain:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=ghcr.io/${{ github.repository }}/toolchain:latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Build all mods inside the toolchain image
      shell: bash
      run: |
        set -euo pipefail
        rm -rf dist
        mkdir -p .tmp
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          -w /workspace \
          "${{ steps.img.outputs.ref }}" \
          bash -c 'python3 -m tools.commands.fetch_companion_artifacts && python3 -m tools.commands.build --all'

    # Publishes one write-once release per mod whose meta.xml version has no release yet.
    # Nothing is republished, so a run with no version bumps is a no-op.
    - name: Publish per-mod releases
      id: mods
      env:
        GH_TOKEN: ${{ github.token }}
      run: python .github/scripts/publish_mod_releases.py

    # Only refreshed when something actually shipped, so the index's date reflects the
    # last real release rather than the last push to master.
    - name: Refresh Latest Releases index
      if: steps.mods.outputs.published != '0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python .github/scripts/publish_hub_release.py
