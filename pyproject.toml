[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zanju-wot-mods-tools"
version = "0.0.0"
description = "Repository tooling for zanju-wot-mods"
requires-python = ">=3.9"

# No console scripts: the single `zwm` entrypoint is baked into the toolchain
# image (tools/Dockerfile -> /usr/local/bin/zwm -> python3 -m tools.cli).

[tool.setuptools]
packages = ["tools", "tools.core", "tools.commands"]

[tool.black]
line-length = 120
target-version = ["py39"]
# Python 2.7 sources (mod runtime, its tests, and the shared 2.7 test launcher) are
# linted by flake8 under Python 2.7 instead; see `zwm lint py27-lint`.
extend-exclude = '''
/(
    \.venv
  | dist
  | \.tmp
  | mods/.+/src
  | mods/.+/tests
  | mods/.+/ui/build
  | testing
)/
'''

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
    ".venv",
    "dist",
    ".tmp",
    "mods/*/src",
    "mods/*/tests",
    "mods/*/ui/build",
    "testing",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/commands/lint.py" = ["B904"]

[tool.autopep8]
max_line_length = 120
select = "E1,E2,E3,W291,W292,W293,W391"