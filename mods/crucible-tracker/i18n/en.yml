# Hover card
LABEL_NO_ACTIVE: "No active Crucible"
# {stage} is the number of the current mission, {total} the number of missions in the Crucible.
LABEL_MISSION: "Mission {stage} of {total}"
# Above the conditions of one mission in the list of the active Crucible. {stage} is the number of the mission.
LABEL_MISSION_NUMBER: "Mission {stage}"
# {done} is how many times the player completed the Crucible, {allowed} how many times the Crucible allows.
LABEL_COMPLETIONS: "Completions: {done} / {allowed}"
# The Crucible can be started.
LABEL_AVAILABLE: "Available"
# The Crucible ran out of shields, and the next restart costs nothing.
LABEL_FREE_RESTART: "Free restart available"
# The Crucible ran out of shields. The price and the currency icon follow this text.
LABEL_RESTART_FOR: "Restart available for:"
# Above a list of vehicle names, one per line.
LABEL_IN_BATTLE: "Vehicles in battle:"
# A vehicle that can play the Crucible is in a battle that has not ended yet. The same text shows with a Crucible active and with none active.
LABEL_IN_BATTLE_WARNING: "The result of a battle that is still in progress completes or fails the current mission if a Crucible is active when the battle ends."
# The last line of the hover card.
LABEL_HINT_OPEN: "Click to open the Crucible menu"

# Settings, in Mod Menu
SETTING_GARAGE: "Garage banner"
TOOLTIP_GARAGE_BODY: "Show the Crucible banner beside the vehicle name in the garage, with its hover card."
SETTING_BATTLE: "Battle panel"
TOOLTIP_BATTLE_BODY: "Show the progress of the current Crucible mission in battle. Hold Ctrl and drag the panel to move it."
# The three choices come from the client's own setting for the details of the damage log: "Display always", "Press Alt to display", "Do not display".
SETTING_PANEL_DETAILS: "Battle panel details"
TOOLTIP_PANEL_DETAILS_BODY: "When the battle panel shows the full information instead of the essential only."
# How the battle panel shows the progress of each condition. The flat bar is the original look. The round dial is a circle with its bottom quarter cut out.
SETTING_PANEL_STYLE: "Battle panel progress"
SETTING_PANEL_STYLE_FLAT: "Flat bar"
SETTING_PANEL_STYLE_ROUND: "Round dial"
TOOLTIP_PANEL_STYLE_BODY: "Style of the progress bar."
# What the numbers beside the progress of a condition show. "Current" is the value so far, "required" is the value that the condition asks for.
SETTING_PANEL_FIGURES: "Battle panel numbers"
SETTING_PANEL_FIGURES_BOTH: "Current and required"
SETTING_PANEL_FIGURES_VALUE: "Current only"
TOOLTIP_PANEL_FIGURES_BODY: "Which values the battle panel shows beside the progress of each condition."
