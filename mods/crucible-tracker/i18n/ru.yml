# Всплывающая карточка
LABEL_NO_ACTIVE: "Нет активного Вызова"
# {stage} — номер текущей задачи, {total} — общее количество задач в Вызове.
LABEL_MISSION: "Задача {stage} из {total}"
# Отображается над условиями задачи в списке активного Вызова. {stage} — это номер задачи.
LABEL_MISSION_NUMBER: "Задача {stage}"
# {done} — сколько раз игрок завершил Вызов, {allowed} — сколько раз Вызов позволяет это сделать.
LABEL_COMPLETIONS: "Завершено: {done} / {allowed}"
# Вызов можно запустить.
LABEL_AVAILABLE: "Доступно"
# У Вызова закончились щиты, и следующий перезапуск бесплатный.
LABEL_FREE_RESTART: "Доступен бесплатный перезапуск"
# У Вызова закончились щиты. Цена и иконка валюты отображаются после этого текста.
LABEL_RESTART_FOR: "Доступен перезапуск за:"
# Отображается над списком названий танков (по одной на строку).
LABEL_IN_BATTLE: "Танки в бою:"
# Танки, подходящие для Вызова, находятся в бою, который ещё не завершился. Этот текст показывается как при активном Вызове, так и без него.
LABEL_IN_BATTLE_WARNING: "Результат ещё идущего боя завершит или провалит текущую задачу, если в момент окончания боя будет активен Вызов."
# Последняя строка всплывающей карточки.
LABEL_HINT_OPEN: "ЛКМ — открыть меню Вызова"

# Настройки в меню модов
SETTING_GARAGE: "Баннер в Ангаре"
TOOLTIP_GARAGE_BODY: "Показывать баннер Вызова рядом с названием танка в Ангаре вместе со всплывающей подсказкой."
SETTING_BATTLE: "Боевая панель"
TOOLTIP_BATTLE_BODY: "Показывать прогресс текущей задачи Вызова прямо в бою. Зажмите Ctrl и перетащите панель, чтобы изменить её положение."
# Три доступных варианта берутся из собственных настроек игрового клиента для панели повреждений: «Отображать всегда», «Показывать по Alt», «Не отображать».
SETTING_PANEL_DETAILS: "Подробная боевая панель"
TOOLTIP_PANEL_DETAILS_BODY: "Определяет, когда боевая панель показывает полную информацию, а не только основную."
# Как боевая панель отображает прогресс каждого условия. Плоская шкала — это стандартный вид. Круговая шкала — круг с вырезанной нижней четвертью.
SETTING_PANEL_STYLE: "Прогресс на боевой панели"
SETTING_PANEL_STYLE_FLAT: "Плоская шкала"
SETTING_PANEL_STYLE_ROUND: "Круговая шкала"
TOOLTIP_PANEL_STYLE_BODY: "Стиль шкалы прогресса."
# Что показывают числа рядом с прогрессом выполнения условия. «Текущее» — значение на данный момент, «требуемое» — целевое значение условия.
SETTING_PANEL_FIGURES: "Числа на боевой панели"
SETTING_PANEL_FIGURES_BOTH: "Текущее и требуемое"
SETTING_PANEL_FIGURES_VALUE: "Только текущее"
TOOLTIP_PANEL_FIGURES_BODY: "Какие числовые значения боевая панель отображает рядом с прогрессом каждого условия."
