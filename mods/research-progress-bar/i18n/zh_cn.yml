# Configurator tooltips
# en: "Enables research or purchase of items on the bar whenever possible. This uses the game's native confirmation windows, so there is no risk of a misclick."
TOOLTIP_CLICK_TO_RESEARCH_BODY: "允许随时在工具栏上研究或购买物品。此功能使用游戏的原生确认窗口，因此不会发生误点击。"
# en: "Show Total XP progress, which combines Vehicle XP with Free XP. The Total XP counter next to the bar and the matching row in tooltips show the combined progress, while the yellow bar segment and yellow markers show what could be researched using Free XP."
TOOLTIP_SHOW_TOTAL_XP_BODY: "显示总经验进度，即车辆经验与全局经验的总和。进度条旁的总经验数值及提示信息中的对应行显示了合并后的进度，而进度条中的黄色段落与黄色标记则标示了可使用全局经验研发的内容。"
# en: "Show the \"Research now!\" reminder above the mode buttons."
TOOLTIP_RESEARCH_REMINDER_BODY: "在插件按钮上方显示「立即研发！」提醒。"
# en: "Show the \"Accelerate crew training!\" reminder above the mode buttons."
TOOLTIP_ACCELERATED_CREW_TRAINING_REMINDER_BODY: "在插件按钮上方显示「开启加速乘员训练！」提醒。"
# en: "<b>Show hypothetical tier 11 in research</b>: Shows progress towards tier 11 vehicle which might exist in the future.\n<b>Show only real research items</b>: Shows progress only towards research items which exist now.\n<b>Off</b>: Hide research entirely."
TOOLTIP_RESEARCH_BODY: "<b>在研发中显示假设 11 级经验</b>: 显示未来可能上线的 11 级坦克的研发进度。\n<b>仅显示实际研发经验</b>: 仅显示当前已实装研发项目的进度。\n<b>关闭</b>: 完全隐藏研发进度。"
# en: "Field Mods"
TOOLTIP_FIELD_MODS_HEADER: "战地改装"
# en: "<b>Always show</b>: Keep the field mods mode available even after all field modifications are complete.\n<b>Until complete</b>: Hide the field mods mode once all field modifications are complete.\n<b>Off</b>: Hide field mods entirely."
TOOLTIP_FIELD_MODS_BODY: "<b>始终显示</b>: 即使全部战地改装项目研发完毕，仍保留战地改装进度显示功能。\n<b>直至完成</b>: 全部战地改装研发完成后自动隐藏战地改装进度项.\n<b>关闭</b>: 完全隐藏战地改装进度。"
# en: "Show tier XI upgrade tree progress."
TOOLTIP_UPGRADES_BODY: "显示 11 级研发改装进度。"
# en: "Elite"
TOOLTIP_ELITE_HEADER: "精英等级"
# en: "<b>On</b>: Show elite badges and tier XI customization elements.\n<b>Customization only</b>: Show tier XI customization elements and hide elite badges.\n<b>Off</b>: Hide elite progress entirely."
TOOLTIP_ELITE_BODY: "<b>开启</b>: 显示精英等级与 11 级改装相关内容。\n<b>只显示战地改装进度</b>: 显示 11 级改装项目，隐藏精英等级。\n<b>关闭</b>: 完全隐藏精英等级车辆进度。"

