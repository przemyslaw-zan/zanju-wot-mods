# Tooltip titles. The client prints the title above the list of modifiers.
TITLE_DISP_MOVEMENT: "Dispersion During Movement"
TITLE_DISP_HULL_TRAVERSE: "Dispersion During Hull Traverse"
TITLE_DISP_GUN_TRAVERSE: "Dispersion During Gun Traverse"
TITLE_DISP_AFTER_SHOT: "Dispersion After Firing"
