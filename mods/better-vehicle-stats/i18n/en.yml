TITLE_TERRAIN_SOFT: "Soft Terrain Resistance"

# Tooltip descriptions. Say what the number means, because the game never showed it before.
DESC_DISP_MOVEMENT: "How much the aiming circle grows for each km/h of speed. A smaller number keeps the circle tighter while you drive."
DESC_DISP_HULL_TRAVERSE: "How much the aiming circle grows for each degree per second of hull rotation. A smaller number keeps the circle tighter while you turn."
DESC_DISP_GUN_TRAVERSE: "How much the aiming circle grows for each degree per second of turret rotation. A smaller number keeps the circle tighter while you traverse the gun."
DESC_DISP_AFTER_SHOT: "How many times wider the aiming circle becomes at the moment you fire. A smaller number returns you to full accuracy sooner."
DESC_TERRAIN_HARD: "How much hard ground slows the vehicle. A smaller number means the vehicle keeps more of its engine power on roads and firm surfaces."
DESC_TERRAIN_MEDIUM: "How much moderately soft ground slows the vehicle. A smaller number means the vehicle keeps more of its engine power on grass and gravel."
DESC_TERRAIN_SOFT: "How much soft ground slows the vehicle. A smaller number means the vehicle keeps more of its engine power in sand, mud and swamp."
