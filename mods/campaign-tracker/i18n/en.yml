# Widget states
LABEL_NO_MISSION: "No mission for this vehicle"
LABEL_NO_VEHICLE: "No vehicle in the garage"
LABEL_DISABLED: "Campaign not available"
LABEL_PAUSED: "Mission on pause"

# Hover card
# {name} is the vehicle the operation awards, which is what the game names each operation after.
LABEL_OPERATION_TITLE: "Operation {name}"
# "Primary" and "secondary" are the words the game itself uses for these two groups.
# Its own key names say main/add, but no text it shows a player ever does.
LABEL_PRIMARY_CONDITIONS: "Primary conditions"
LABEL_SECONDARY_CONDITIONS: "Secondary conditions"
# Separates two conditions where meeting either one is enough.
LABEL_OR: "OR"
# Heads the list of vehicles that already completed a mission and cannot repeat it.
LABEL_LOCKED_VEHICLES: "Locked vehicles:"
# Warns that the vehicle in the garage is one of those, so no battle in it counts towards the
# mission. Shown where the pause warning is shown, and in the same colour.
LABEL_VEHICLE_LOCKED: "Vehicle locked"
# Pace on a mission that must reach a total inside a fixed run of battles. The mission asks for
# one constant average -- 25 hits in 10 battles is 2.5 a battle -- and {percent} says where the
# player stands against it. 100 is exactly on the average, above it is ahead, below it is behind.
# The average is named rather than the total, because a player at 6 hits of 25 is at 24 percent
# of the total but 120 percent of the average that gets them there.
LABEL_PACE: "{percent}% of the target average per battle"
# What a click on a banner does, listed at the foot of the hover card. Only campaign 2's last
# operation accepts pause and reset, so most cards show the first line alone.
LABEL_HINT_OPEN: "Click to open the mission"
LABEL_HINT_PAUSE: "Shift + Click to pause the mission"
# Shown in place of the line above once the mission is paused.
LABEL_HINT_RESUME: "Shift + Click to resume the mission"
LABEL_HINT_RESET: "Ctrl + Click to reset the mission"
LABEL_NO_CONDITIONS: "No conditions to show"
